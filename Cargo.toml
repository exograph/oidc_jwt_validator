[package]
name = "oidc-jwt-validator"
version = "0.2.3"
edition = "2021"
license = "MIT"
include = ["/src", "LICENSE.txt", "/examples"]
repository = "https://github.com/MinisculeGirraffe/oidc_jwt_validator"
description = "Batteries included validaton of Access Tokens from an OIDC Provider"
readme = "README.md"

[features]
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]
rust_crypto = ["jsonwebtoken/rust_crypto"]

[dependencies]
jsonwebtoken = { version = "10", default-features = false }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4" }
web-time = "1.1"

[dev-dependencies]
actix-web = { version = "4.2.1" }
serde_json = "1.0.89"
tokio = { version = "1", features = ["full"] }
